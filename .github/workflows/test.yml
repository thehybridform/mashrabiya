name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Syntax check
        run: |
          node --check dist/mashrabiya-logic.js
          node --input-type=module --check < dist/mashrabiya-card.js
      - name: Tests
        run: npm test
